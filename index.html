<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#c45c26">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="학습메뉴">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>학습 메뉴</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app menu-app">
    <header class="menu-header">
      <h1 class="menu-title">학습 메뉴</h1>
      <p class="menu-subtitle">원하는 학습을 선택하세요</p>
    </header>

    <nav class="menu-list" aria-label="학습 메뉴">
      <a class="menu-card" href="japanese.html">
        <span class="menu-card-icon" aria-hidden="true">あ</span>
        <span class="menu-card-body">
          <span class="menu-card-title">일본어</span>
          <span class="menu-card-desc">한자 암기 노트 · 플래시카드</span>
        </span>
        <span class="menu-card-arrow" aria-hidden="true">→</span>
      </a>

      <a class="menu-card" href="exam-select.html">
        <span class="menu-card-icon menu-card-icon-exam" aria-hidden="true">試</span>
        <span class="menu-card-body">
          <span class="menu-card-title">경비지도사 기출문제</span>
          <span class="menu-card-desc">1차·2차 기출문제 · 정답 해설</span>
        </span>
        <span class="menu-card-arrow" aria-hidden="true">→</span>
      </a>
    </nav>

    <section class="menu-history-section hidden" id="menuExamHistorySection" aria-label="기출 풀이 기록">
      <h2 class="menu-history-heading">기출 풀이 기록</h2>
      <div id="menuExamHistory"></div>
    </section>

    <aside class="ad-banner-slot" data-adfit aria-label="광고"></aside>
  </div>

  <script src="adfit.js"></script>
  <script src="exam-history.js"></script>
  <script>
    (function initMenuExamHistory() {
      const section = document.getElementById('menuExamHistorySection');
      const container = document.getElementById('menuExamHistory');
      if (!section || !container) return;
      const count = renderExamHistoryList(container, {
        limit: 8,
      });
      if (count > 0) section.classList.remove('hidden');
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
