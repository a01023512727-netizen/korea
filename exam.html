<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#c45c26">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="기출문제">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>경비지도사 기출문제</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app exam-app">
    <a class="back-link" href="./">← 메뉴</a>

    <header class="exam-header">
      <h1 class="exam-title" id="examTitle">경비지도사 기출문제</h1>
      <p class="exam-subtitle" id="examSubtitle"></p>
      <p class="exam-meta" id="examMeta"></p>
      <div class="exam-complete-banner hidden" id="examCompleteBanner" role="status"></div>
    </header>

    <section class="exam-history-section" id="examHistorySection" aria-label="풀이 기록">
      <h2 class="exam-history-heading">풀이 기록</h2>
      <div id="examHistory"></div>
    </section>

    <main class="exam-main" id="examList"></main>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="exam-history.js"></script>
  <script src="exam.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
